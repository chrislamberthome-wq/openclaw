name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "repeat-ai-stream-cert-v1/**"
  pull_request:
    paths:
      - "repeat-ai-stream-cert-v1/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: repeat-ai-stream-cert-v1

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check verifier/ tests/ examples/

      - name: Format check
        run: ruff format --check verifier/ tests/ examples/

      - name: Type check
        run: mypy verifier/

      - name: Validate schemas
        run: |
          python -c "
          import json, jsonschema
          for s in [
            'schemas/ai_inference_receipt.schema.json',
            'schemas/input_event_envelope.schema.json',
            'schemas/replay_verification_result.schema.json',
          ]:
              schema = json.load(open(s))
              jsonschema.Draft7Validator.check_schema(schema)
          print('All schemas valid.')
          "

      - name: Run tests
        run: pytest tests/ -v --cov=verifier --cov-report=term-missing

      - name: Run examples (smoke test)
        run: |
          python examples/emit_receipt.py
          python examples/replay_demo.py
