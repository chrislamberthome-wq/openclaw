[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repeat-ai-stream-cert-v1"
version = "1.0.0"
description = "Fail-closed v1.0 streaming certificate verifier for AI inference receipts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai", "audit", "reproducibility", "streaming", "certificate", "verifier"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "jsonschema>=4.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
]

[project.urls]
Repository = "https://github.com/openclaw/openclaw/tree/main/repeat-ai-stream-cert-v1"

[tool.hatch.build.targets.wheel]
packages = ["verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
