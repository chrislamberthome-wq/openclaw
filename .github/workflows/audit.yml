name: Audit

# Fail-closed REPEAT Level-3 receipt verification.
# Every push and pull request must pass; a stale or missing receipt blocks merge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-verify:
    name: "audit / verify receipt"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Verify REPEAT Level-3 receipt
        run: pnpm audit:verify
